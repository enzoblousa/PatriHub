<div class="shell">
  <header class="cabecalho">
    @if (auth.estaAutenticado()) {
      <button
        type="button"
        class="botao-icone botao-sidebar"
        [attr.aria-pressed]="sidebarColapsada()"
        aria-label="Alternar menu lateral"
        (click)="alternarSidebar()"
      >
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <rect x="2.5" y="3.5" width="15" height="13" rx="1" />
          <path d="M7.75 3.5v13" stroke-linecap="round" />
        </svg>
      </button>
    }

    <span class="marca">
      <img class="marca-logo" src="patrihub-logo.png" alt="" />
      PatriHub
    </span>

    <div class="cabecalho-acoes">
      @if (auth.estaAutenticado()) {
        <span class="usuario">{{ auth.usuario()?.nome }}</span>
        <a routerLink="/perfil">Perfil</a>
        <button type="button" (click)="sair()">Sair</button>
      }
    </div>
  </header>

  <div class="corpo">
    @if (auth.estaAutenticado()) {
      <aside class="sidebar" [class.sidebar--colapsada]="sidebarColapsada()">
        <nav class="navegacao">
          <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
            <svg class="icone-nav" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17V10M10 17V3M17 17V13" />
            </svg>
            <span class="rotulo">Dashboard</span>
          </a>
          <a routerLink="/ativos" routerLinkActive="ativo">
            <svg class="icone-nav" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9.5L10 3l7 6.5" />
              <path d="M4.5 9.5V17h11V9.5" />
            </svg>
            <span class="rotulo">Ativos</span>
          </a>
          <a routerLink="/lancamentos" routerLinkActive="ativo">
            <svg class="icone-nav" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2.5" width="12" height="15" rx="1" />
              <path d="M7 7h6M7 10.5h6M7 14h3.5" />
            </svg>
            <span class="rotulo">Lançamentos</span>
          </a>
          <a routerLink="/locatarios" routerLinkActive="ativo">
            <svg class="icone-nav" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="10" cy="6.5" r="3" />
              <path d="M4 17c0-3.5 3-5.5 6-5.5s6 2 6 5.5" />
            </svg>
            <span class="rotulo">Locatários</span>
          </a>
          <a routerLink="/contratos" routerLinkActive="ativo">
            <svg class="icone-nav" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2.5h5.5L15 6v11.5H6V2.5z" />
              <path d="M11.5 2.5V6H15" />
              <path d="M8.25 10h4.5M8.25 13h4.5" />
            </svg>
            <span class="rotulo">Contratos</span>
          </a>
          @if (auth.usuario()?.papel === 'Admin') {
            <a routerLink="/admin" routerLinkActive="ativo">
              <svg class="icone-nav" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2.5l5.5 2.2v3.8c0 4-2.3 6.4-5.5 7.8-3.2-1.4-5.5-3.8-5.5-7.8V4.7L10 2.5z" />
                <path d="M7.5 10l1.8 1.8L13 8" />
              </svg>
              <span class="rotulo">Admin</span>
            </a>
          }
        </nav>
      </aside>
    }

    <main>
      <router-outlet />
    </main>
  </div>
</div>
