<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>PatriHub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes do Angular subir, senão uma sessão em modo claro pisca
      // escuro→claro no primeiro paint (ver core/tema/tema.ts, que faz o mesmo em runtime).
      (function () {
        try {
          if (localStorage.getItem('patrihub.tema') === 'claro') {
            document.documentElement.setAttribute('data-theme', 'claro');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
